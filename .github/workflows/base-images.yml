name: base-images

# Builds the shared MetaBuilder base images and publishes them to GHCR as
# multi-arch manifests, so every other repo pulls a warm base instead of
# rebuilding one. Consumers retag locally to the name the app Dockerfiles
# expect:
#
#   docker pull ghcr.io/johndoe6345789/deployment/base-apt:latest
#   docker tag  ghcr.io/johndoe6345789/deployment/base-apt:latest \
#               metabuilder/base-apt:latest
#
# Published here:
#
#   base-apt        ubuntu:24.04 + every apt package used across the platform.
#                   Self-contained. The dbal repo currently rebuilds this on
#                   every run from a metabuilder checkout; it should pull.
#   base-conan-cli  base-apt + Conan 2 + the CLI's C++ deps. Needs
#                   frontends/cli/conanfile.txt from the metabuilder repo.
#   base-node-deps  node:24 + the whole npm workspace. Needs metabuilder's
#                   package manifests, which in turn need its sibling repos
#                   assembled.
#
# Deliberately NOT built here. Each of these COPYs from a directory that left
# metabuilder during the repo split, so it cannot build from any checkout that
# exists today. Reviving one means teaching this workflow to check out the repo
# that now owns those files:
#
#   conan-dbal         libraries/dbal/production/build-config/conanfile.py
#   conan-gameengine   frontends/gameengine/conanfile.py
#   conan-media        services/media_daemon/build-config/conanfile.txt
#   pip-deps           requirements.txt from roughly seven repos
#   node-deps-postgres the eight removed frontends, plus a package-lock.json
#                      that is not committed anywhere
#   devcontainer       composes all of the above
#
# Two more are buildable but excluded on purpose:
#
#   conan-qt6     conanfile.txt asks for qt/6.7.3, which ConanCenter has no
#                 prebuilt binary for. --build=missing compiles Qt from source:
#                 hours of runner time and enough disk to exhaust the runner.
#                 This is the same trap metabuilder's qt6.yml avoids by using
#                 aqtinstall instead.
#   android-sdk   builds fine, but nothing left in the platform consumes it.

on:
  push:
    branches: [main]
    paths:
      - 'base-images/Dockerfile.apt'
      - 'base-images/Dockerfile.conan-cli'
      - 'base-images/Dockerfile.node-deps'
      - '.github/workflows/base-images.yml'
  # base-apt tracks Ubuntu security updates and base-node-deps tracks npm, so
  # both drift even when no file here changes.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      metabuilder_ref:
        description: 'Branch, tag or SHA of the metabuilder repo to build against'
        type: string
        default: 'main'

concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  METABUILDER_REF: ${{ inputs.metabuilder_ref || 'main' }}

jobs:
  # ---------------------------------------------------------------------------
  # base-apt — the foundation. No dependency on any other repo.
  # ---------------------------------------------------------------------------
  apt:
    name: apt (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      IMAGE: ghcr.io/johndoe6345789/deployment/base-apt
      ARCH: ${{ matrix.arch }}
      SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile.apt has no COPY, so the context is just this directory
      # rather than the repo root — nothing else needs uploading.
      - name: Build
        run: |
          docker build \
            -f base-images/Dockerfile.apt \
            -t "$IMAGE:${SHA}-${ARCH}" \
            base-images

      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:${SHA}-${ARCH}" sh -c '
            set -e
            for bin in cmake ninja g++ clang-18 python3 git curl jq ffmpeg; do
              command -v "$bin" > /dev/null || { echo "$bin missing"; exit 1; }
            done
            cmake --version | head -1
            g++ --version | head -1
          '

      # Retried because GHCR intermittently answers a blob upload with
      # "unknown blob", which killed node-deps (arm64) while its amd64 twin —
      # pushing to the same package seconds earlier — succeeded. It is a
      # registry-side transient, so the retry is the fix rather than a mask.
      - name: Push
        run: |
          for attempt in 1 2 3; do
            docker push "$IMAGE:${SHA}-${ARCH}" && exit 0
            echo "push attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::docker push failed after 3 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # base-node-deps — needs metabuilder's workspace, not base-apt.
  # ---------------------------------------------------------------------------
  node-deps:
    name: node-deps (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      IMAGE: ghcr.io/johndoe6345789/deployment/base-node-deps
      ARCH: ${{ matrix.arch }}
      SHA: ${{ github.sha }}

    steps:
      - name: Checkout deployment
        uses: actions/checkout@v7

      - name: Checkout metabuilder
        uses: actions/checkout@v7
        with:
          repository: johndoe6345789/metabuilder
          ref: ${{ env.METABUILDER_REF }}
          path: _metabuilder

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost || true
          df -h / | tail -1

      # Dockerfile.node-deps COPYs a package.json from every npm workspace, and
      # those workspaces live in metabuilder's sibling repos. A COPY of a path
      # that is absent is a hard build failure, so this must run first.
      - name: Assemble metabuilder workspace
        working-directory: _metabuilder
        env:
          WORKSPACE_TOKEN: ${{ secrets.WORKSPACE_TOKEN }}
        run: python3 .github/scripts/assemble_workspace.py --frontend nextjs --force

      # metabuilder's committed .npmrc points @esbuild-kit and @metabuilder at a
      # Verdaccio on localhost:4873 for desktop builds. No such registry exists
      # on a runner, and Dockerfile.node-deps hard-fails its reachability check
      # on any registry it cannot resolve. Every @metabuilder/* package is a
      # workspace, so npm resolves them locally without a registry.
      #
      # This also keeps the Verdaccio auth token in that file out of the
      # published image, since the COPY layer would otherwise preserve it.
      - name: Point .npmrc at the public registry
        working-directory: _metabuilder
        run: |
          sed -i '/localhost:4873/d; /localhost:8091/d; /host\.docker\.internal/d' .npmrc
          cat .npmrc

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the metabuilder checkout; the Dockerfile stays here.
      - name: Build
        run: |
          docker build \
            -f base-images/Dockerfile.node-deps \
            -t "$IMAGE:${SHA}-${ARCH}" \
            _metabuilder

      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:${SHA}-${ARCH}" sh -c '
            set -e
            test -d /app/node_modules/@metabuilder || { echo "workspace links missing"; exit 1; }
            echo "workspace packages: $(ls /app/node_modules/@metabuilder | wc -l)"
            node --version
          '

      # A published base image must not carry credentials. The sed above runs
      # on the host, before the context is sent, so this asserts it worked
      # rather than trusting that it did.
      - name: Assert no registry credentials were baked in
        run: |
          if docker run --rm --entrypoint sh "$IMAGE:${SHA}-${ARCH}" \
               -c 'cat /app/.npmrc 2>/dev/null' | grep -E '_auth|_authToken|localhost:(4873|8091)'; then
            echo "::error::.npmrc in the image still contains registry credentials - refusing to push"
            exit 1
          fi
          echo "no credentials in the image .npmrc"

      # Retried because GHCR intermittently answers a blob upload with
      # "unknown blob", which killed node-deps (arm64) while its amd64 twin —
      # pushing to the same package seconds earlier — succeeded. It is a
      # registry-side transient, so the retry is the fix rather than a mask.
      - name: Push
        run: |
          for attempt in 1 2 3; do
            docker push "$IMAGE:${SHA}-${ARCH}" && exit 0
            echo "push attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::docker push failed after 3 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # base-conan-cli — FROM base-apt, and COPYs metabuilder's cli conanfile.
  # ---------------------------------------------------------------------------
  conan-cli:
    name: conan-cli (${{ matrix.arch }})
    needs: apt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      IMAGE: ghcr.io/johndoe6345789/deployment/base-conan-cli
      PARENT: ghcr.io/johndoe6345789/deployment/base-apt
      ARCH: ${{ matrix.arch }}
      SHA: ${{ github.sha }}

    steps:
      - name: Checkout deployment
        uses: actions/checkout@v7

      - name: Checkout metabuilder
        uses: actions/checkout@v7
        with:
          repository: johndoe6345789/metabuilder
          ref: ${{ env.METABUILDER_REF }}
          path: _metabuilder

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the base-apt this run just produced, rather than :latest, so the
      # two images are always built from the same commit. Retagging to the
      # local name means Dockerfile.conan-cli needs no BASE_REGISTRY override.
      - name: Pull base-apt from this run
        run: |
          docker pull "$PARENT:${SHA}-${ARCH}"
          docker tag "$PARENT:${SHA}-${ARCH}" metabuilder/base-apt:latest

      - name: Build
        run: |
          docker build \
            -f base-images/Dockerfile.conan-cli \
            -t "$IMAGE:${SHA}-${ARCH}" \
            _metabuilder

      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:${SHA}-${ARCH}" sh -c '
            set -e
            conan --version
            # The point of this image is a warm package cache; an empty one
            # means conan install silently resolved nothing.
            test -d /root/.conan2/p || { echo "conan package cache is empty"; exit 1; }
            conan list "*" 2>/dev/null | tail -20
          '

      # Retried because GHCR intermittently answers a blob upload with
      # "unknown blob", which killed node-deps (arm64) while its amd64 twin —
      # pushing to the same package seconds earlier — succeeded. It is a
      # registry-side transient, so the retry is the fix rather than a mask.
      - name: Push
        run: |
          for attempt in 1 2 3; do
            docker push "$IMAGE:${SHA}-${ARCH}" && exit 0
            echo "push attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::docker push failed after 3 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # Join each per-arch pair into one multi-arch tag consumers can pull.
  # ---------------------------------------------------------------------------
  manifest:
    name: manifest (${{ matrix.base }})
    needs: [apt, node-deps, conan-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        base: [apt, node-deps, conan-cli]

    env:
      IMAGE: ghcr.io/johndoe6345789/deployment/base-${{ matrix.base }}
      SHA: ${{ github.sha }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${SHA}" \
            "$IMAGE:${SHA}-amd64" \
            "$IMAGE:${SHA}-arm64"

      - name: Verify manifest platforms
        run: |
          docker buildx imagetools inspect "$IMAGE:${SHA}"
          RAW=$(docker buildx imagetools inspect "$IMAGE:${SHA}" --raw)
          for want in amd64 arm64; do
            echo "$RAW" | grep -q "\"$want\"" \
              || { echo "manifest is missing linux/$want"; exit 1; }
          done

      - name: Summarise
        run: |
          {
            echo "### deployment/base-${{ matrix.base }}"
            echo
            echo '```'
            echo "docker pull $IMAGE:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
