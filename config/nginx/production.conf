user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml
             image/svg+xml;

  # Shared proxy settings
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Map Referer header to the correct Next.js upstream for root-level
  # __nextjs requests (fonts, stack-frames, etc.) that lack the app prefix.
  map $http_referer $nextjs_upstream {
    default              codegen;
    "~*/codegen"         codegen;
    "~*/pastebin"        pastebin;
    "~*/workflowui"      workflowui;
    "~*/app"             frontend-app;
    "~*/postgres"        postgres-dashboard;
    "~*/emailclient"     emailclient-app;
    "~*/dbal"            dbal-frontend;
    "~*/terminal"        dockerterminal;
    "~*/packagerepo"     packagerepo;
    "~*/repoforge"       repoforge;
    "~*/caproverforge"   caproverforge;
  }

  server {
    listen 80;
    server_name _;
    server_tokens off;

    # Docker DNS resolver — allows nginx to start even if backends are down
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ================================================================
    # Health check
    # ================================================================
    location /health {
      access_log off;
      return 200 '{"status":"healthy"}';
      add_header Content-Type application/json;
    }

    # ================================================================
    # Root favicon
    # ================================================================
    location = /favicon.ico {
      alias /usr/share/nginx/portal/favicon.ico;
      access_log off;
    }
    location = /favicon.svg {
      alias /usr/share/nginx/portal/favicon.svg;
      access_log off;
    }

    # ================================================================
    # Welcome portal (static HTML)
    # ================================================================
    location = / {
      root /usr/share/nginx/portal;
      try_files /index.html =404;

      # The portal page is baked into this image and changes on every
      # deploy, so it has to revalidate -- otherwise visitors keep being
      # served the previous build's page.
      add_header Cache-Control "no-cache" always;
      # add_header at this level replaces the server-level set rather than
      # adding to it, so the security headers are repeated here on purpose.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /portal/ {
      alias /usr/share/nginx/portal/;

      add_header Cache-Control "no-cache" always;
      # add_header at this level replaces the server-level set rather than
      # adding to it, so the security headers are repeated here on purpose.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ================================================================
    # Web Applications
    # ================================================================

    # WorkflowUI - Visual workflow editor
    location /workflowui {
      set $upstream_workflowui workflowui;
      proxy_pass http://$upstream_workflowui:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # CodeForge IDE (Next.js with basePath: '/codegen')
    location /codegen {
      set $upstream_codegen codegen;
      proxy_pass http://$upstream_codegen:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Pastebin
    location /pastebin {
      set $upstream_pastebin pastebin;
      proxy_pass http://$upstream_pastebin:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Postgres Dashboard
    location /postgres {
      set $upstream_postgres postgres-dashboard;
      proxy_pass http://$upstream_postgres:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Email Client
    location /emailclient {
      set $upstream_emailclient emailclient-app;
      proxy_pass http://$upstream_emailclient:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Exploded Diagrams
    location /diagrams {
      set $upstream_diagrams exploded-diagrams;
      proxy_pass http://$upstream_diagrams:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Storybook (built with vite base: '/storybook/' — proxy as-is, no rewrite)
    location /storybook/ {
      set $upstream_storybook storybook;
      proxy_pass http://$upstream_storybook:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /storybook {
      return 301 /storybook/;
    }

    # DBAL Frontend - Daemon overview + query console
    location /dbal {
      set $upstream_dbal_frontend dbal-frontend;
      proxy_pass http://$upstream_dbal_frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Docker Terminal
    location /terminal {
      set $upstream_terminal dockerterminal;
      proxy_pass http://$upstream_terminal:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Docker Terminal Backend API — strips /terminal-api/ prefix
    location /terminal-api/ {
      set $upstream_terminal_backend dockerterminal-backend;
      rewrite ^/terminal-api/(.*)$ /$1 break;
      proxy_pass http://$upstream_terminal_backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Package Repo
    location /packagerepo {
      set $upstream_packagerepo packagerepo;
      proxy_pass http://$upstream_packagerepo:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Docker Registry HTTP API V2 (`docker pull`/`docker push`) -- the
    # registry protocol always hits /v2/ at the host root, so this can't
    # live under /packagerepo like the web UI does. Proxies straight to
    # packagerepo-backend's Drogon RegistryV2Ctrl, which serves /v2/...
    # verbatim (no path rewrite). Large layer uploads need a raised body
    # size and buffering off so PATCH/PUT blob chunks stream through.
    # Exact-match /v2 (no trailing slash) covers the ping check some
    # Docker clients send without it -- RegistryV2Ctrl registers both.
    location = /v2 {
      set $upstream_packagerepo_backend packagerepo-backend;
      proxy_pass http://$upstream_packagerepo_backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v2/ {
      set $upstream_packagerepo_backend packagerepo-backend;
      proxy_pass http://$upstream_packagerepo_backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      client_max_body_size 0;
    }

    # RepoForge - Android app download portal
    location /repoforge {
      set $upstream_repoforge repoforge;
      proxy_pass http://$upstream_repoforge:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CaproverForge - Android app download portal
    location /caproverforge {
      set $upstream_caproverforge caproverforge;
      proxy_pass http://$upstream_caproverforge:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend App
    # Content-hashed bundles. The filename changes whenever the contents
    # do, so these are safe to cache forever -- and should be. Longer
    # prefix than /app below, so it wins for these requests.
    location /app/_next/static/ {
      set $upstream_app_static frontend-app;
      proxy_pass http://$upstream_app_static:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      # add_header at this level replaces the server-level set rather than
      # adding to it, so the security headers are repeated here on purpose.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Next.js serves prerendered HTML with `Cache-Control: s-maxage=31536000`
    # -- a year in any shared cache, for a document that is replaced on every
    # deploy. Nothing purges that, and the URL never changes, so a visitor
    # (or Cloudflare) can end up pinned to a dead build indefinitely. HTML
    # revalidates instead; the immutable assets keep their long TTL above.
    location /app {
      set $upstream_app frontend-app;
      proxy_pass http://$upstream_app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-cache" always;
      # add_header at this level replaces the server-level set rather than
      # adding to it, so the security headers are repeated here on purpose.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ================================================================
    # Administration Tools
    # ================================================================

    # phpMyAdmin - MySQL admin
    location /phpmyadmin/ {
      set $upstream_phpmyadmin phpmyadmin;
      proxy_pass http://$upstream_phpmyadmin:80/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }

    # Mongo Express - MongoDB admin
    # ME_CONFIG_SITE_BASEURL=/mongo-express means it expects the prefix in requests
    location /mongo-express/ {
      set $upstream_mongoexpress mongo-express;
      proxy_pass http://$upstream_mongoexpress:8081/mongo-express/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }

    # RedisInsight - Redis admin
    # RI_PROXY_PATH=/redis-insight means it expects the prefix in requests
    location /redis-insight/ {
      set $upstream_redisinsight redisinsight;
      proxy_pass http://$upstream_redisinsight:5540;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Kibana - Elasticsearch admin
    # SERVER_BASEPATH=/kibana + SERVER_REWRITEBASEPATH=true handles path internally
    location /kibana/ {
      set $upstream_kibana kibana;
      proxy_pass http://$upstream_kibana:5601;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }

    # ================================================================
    # Monitoring (optional, requires --profile monitoring)
    # ================================================================

    # Grafana - Metrics visualization
    # GF_SERVER_ROOT_URL + GF_SERVER_SERVE_FROM_SUB_PATH handles path internally
    location /grafana/ {
      set $upstream_grafana grafana;
      proxy_pass http://$upstream_grafana:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }
    location = /grafana {
      return 301 /grafana/;
    }

    # Prometheus - Metrics scraping
    # --web.external-url=/prometheus/ means it expects the prefix in requests
    location /prometheus/ {
      set $upstream_prometheus prometheus;
      proxy_pass http://$upstream_prometheus:9090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /prometheus {
      return 301 /prometheus/;
    }

    # ================================================================
    # Backend APIs
    # ================================================================

    # Pastebin Flask Backend API — strips /pastebin-api/ prefix
    location /pastebin-api/ {
      set $upstream_pastebin_backend pastebin-backend;
      rewrite ^/pastebin-api/(.*)$ /$1 break;
      proxy_pass http://$upstream_pastebin_backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DBAL OIDC discovery (RFC 8414) — exact-match, so it's resolved before
    # the "Hide dotfiles" regex location below, which would otherwise 403
    # this (the path starts with "/.", same shape as a hidden dotfile even
    # though it's a legitimate, required OIDC endpoint). nginx always
    # prefers an exact match over a regex match regardless of file order.
    location = /api/dbal/.well-known/openid-configuration {
      set $upstream_dbal dbal;
      rewrite ^/api/dbal/(.*)$ /$1 break;
      proxy_pass http://$upstream_dbal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DBAL OIDC — must stay reachable without a session, since this is how
    # one is obtained. Sits above the entity rule so it wins on prefix length.
    location /api/dbal/oidc/ {
      set $upstream_dbal dbal;
      rewrite ^/api/dbal/(.*)$ /$1 break;
      proxy_pass http://$upstream_dbal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DBAL entity CRUD (/api/dbal/{tenant}/{pkg}/{entity}).
    #
    # Sent through the app rather than straight to DBAL, because DBAL does not
    # enforce the ACLs its schemas declare: an unauthenticated POST created a
    # StyleRule that says create is god-only, and a DELETE for a missing row
    # answers 404 rather than 403 on every entity, including User. The app's
    # /api/dbal route verifies the session cookie before any write and passes
    # the token on, so anonymous writes stop at the edge. Reads stay open --
    # published pages are meant to be readable, which is what the read ACLs
    # say.
    #
    # DBAL now enforces the role ACLs its schemas declare, but that covers 32
    # entities and 26 declare no write rule at all -- User among them. Going
    # back to a direct proxy_pass would let anyone create a god user again, so
    # this stays until those entities have rules of their own. User needs
    # ownership semantics (a person may edit themselves) rather than a role
    # list, which is a different mechanism, so it is not a one-line fix.
    location /api/dbal/ {
      set $upstream_app_dbal frontend-app;
      rewrite ^/api/dbal/(.*)$ /app/api/dbal/$1 break;
      proxy_pass http://$upstream_app_dbal:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DBAL API direct (/api/{tenant}/{pkg}/{entity} or /api/health etc.)
    #
    # A second, older way into the same data layer. Nothing in the app writes
    # through it -- everything uses /api/dbal -- so writes are refused here
    # outright rather than given a way around the check above.
    location /api/ {
      limit_except GET HEAD OPTIONS {
        deny all;
      }
      set $upstream_dbal dbal;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream_dbal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Email Service API — strip /email-api prefix
    location /email-api/ {
      set $upstream_email email-service;
      rewrite ^/email-api/(.*)$ /$1 break;
      proxy_pass http://$upstream_email:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================================================================
    # Next.js internal paths (fonts, stack-frames, HMR)
    # Next.js emits requests to /__nextjs_* at the root path (without
    # the app basePath prefix). Use the Referer header to route to the
    # correct upstream; falls back to codegen if Referer is absent.
    # ================================================================
    location /__nextjs {
      proxy_pass http://$nextjs_upstream:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # ================================================================
    # Security
    # ================================================================

    # Hide dotfiles
    location ~ /\. {
      deny all;
      access_log off;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
